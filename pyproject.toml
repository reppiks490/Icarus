# Grok (xAI) — 2026-09-20. Whole file. Package metadata + pytest paths + console scripts.
# 2026-09-22: icarus-train; optional ml extra for Astra XGBoost.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icarus"
version = "0.1.0"
description = "THE PULSE OF ICARUS — TradingView-parity paper engine + TV-alert bridge"
requires-python = ">=3.10"
# CA: Windows does not ship the IANA database required by ZoneInfo.
dependencies = ["tzdata; sys_platform == 'win32'"]
readme = "README.md"
authors = [
  {name = "Astra"},
  {name = "Grok (xAI)"},
]

[project.optional-dependencies]
bridge = ["fastapi", "uvicorn", "httpx"]
dev = ["pytest"]
ml = ["numpy>=1.26", "scipy>=1.11", "xgboost>=2.0"]

[project.scripts]
icarus-engine = "icarus_engine.cli:main"
icarus-bridge = "icarus_bridge.cli:main"
icarus-plant = "icarus_plant.cli:main"
icarus-train = "icarus_engine.trainers.__main__:main"

[tool.setuptools.packages.find]
include = ["icarus_engine*", "icarus_bridge*", "icarus_plant*", "icarus_agent*"]

[tool.setuptools.package-data]
icarus_engine = ["*.html", "*.js", "*.css", "strategy/*.json"]
icarus_bridge = ["*.html"]

[tool.pytest.ini_options]
testpaths = ["tests_engine"]
pythonpath = ["."]
addopts = "-q"
