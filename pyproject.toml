# Grok (xAI) — 2026-09-20. Whole file. Package metadata + pytest paths + console scripts.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icarus"
version = "0.1.0"
description = "THE PULSE OF ICARUS — TradingView-parity paper engine + TV-alert bridge"
requires-python = ">=3.10"
readme = "README.md"
authors = [
  {name = "Astra"},
  {name = "Grok (xAI)"},
]

[project.optional-dependencies]
bridge = ["fastapi", "uvicorn", "httpx"]
dev = ["pytest"]

[project.scripts]
icarus-engine = "icarus_engine.cli:main"
icarus-bridge = "icarus_bridge.cli:main"

[tool.setuptools.packages.find]
include = ["icarus_engine*", "icarus_bridge*"]

[tool.pytest.ini_options]
testpaths = ["tests_engine"]
pythonpath = ["."]
addopts = "-q"
