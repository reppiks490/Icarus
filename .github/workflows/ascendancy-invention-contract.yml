name: ascendancy-invention-contract

on:
  push:
    branches: [feat/ascendancy-invention-current-main]
    paths:
      - "icarus_engine/ascendancy/invention.py"
      - "tests_engine/test_ascendancy_invention.py"
      - "icarus_engine/ascendancy/foundry.py"
      - ".github/workflows/ascendancy-invention-contract.yml"
  pull_request:
    paths:
      - "icarus_engine/ascendancy/invention.py"
      - "tests_engine/test_ascendancy_invention.py"
      - "icarus_engine/ascendancy/foundry.py"
      - ".github/workflows/ascendancy-invention-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bridge,databento]"
      - run: python -m pytest tests_engine/test_ascendancy_invention.py tests_engine/test_ascendancy_foundry.py -q
