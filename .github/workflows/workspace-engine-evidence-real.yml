name: Workspace real Engine evidence panel

on:
  pull_request:
    paths:
      - "icarus_engine/engine_evidence_workspace.py"
      - "icarus_engine/workspace_intelligence_panels.py"
      - "tests_engine/test_workspace_engine_evidence_real.py"
      - ".github/workflows/workspace-engine-evidence-real.yml"
      - "docs/integrations/ENGINE_EVIDENCE_WORKSPACE_PANEL.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-workspace-panel:
    name: Read actual Engine evidence through selected workspace
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ICARUS_ENGINE_REAL_ROOT: ${{ github.workspace }}/peer-engine
      ICARUS_ENGINE_REAL_COMMIT: 10d02b2e1ee20797be5945ffe3f4ebb5e4193bb3
      ICARUS_ENGINE_EVIDENCE_ROOT: ${{ github.workspace }}/peer-engine
      ICARUS_ENGINE_EVIDENCE_COMMIT: 10d02b2e1ee20797be5945ffe3f4ebb5e4193bb3
    steps:
      - name: Checkout Icarus candidate
        uses: actions/checkout@v4
        with:
          path: Icarus
      - name: Checkout exact Icarus-engine evidence commit
        uses: actions/checkout@v4
        with:
          repository: reppiks490/Icarus-engine
          ref: 10d02b2e1ee20797be5945ffe3f4ebb5e4193bb3
          path: peer-engine
          persist-credentials: false
      - name: Verify exact peer commit
        run: test "$(git -C "$ICARUS_ENGINE_EVIDENCE_ROOT" rev-parse HEAD)" = "$ICARUS_ENGINE_EVIDENCE_COMMIT"
      - name: Compile and test real read-only workspace connection
        working-directory: Icarus
        run: |
          python -m py_compile icarus_engine/engine_evidence_catalog.py icarus_engine/engine_evidence_gauges.py icarus_engine/engine_evidence_workspace.py icarus_engine/workspace_intelligence_panels.py tests_engine/test_workspace_engine_evidence_real.py
          python -m unittest discover -s tests_engine -p "test_engine_evidence_catalog_real.py" -v
          python -m unittest discover -s tests_engine -p "test_engine_evidence_gauges_real.py" -v
          python -m unittest discover -s tests_engine -p "test_workspace_engine_evidence_real.py" -v
