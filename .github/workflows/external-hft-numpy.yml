name: External HFT L2 native NumPy binary research contract

on:
  pull_request:
    paths:
      - "icarus_engine/external_hft_numpy.py"
      - "tests_engine/test_external_hft_numpy.py"
      - ".github/workflows/external-hft-numpy.yml"
      - "docs/integrations/HFT_L2_NUMPY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-binary-offline:
    name: NPY native roundtrip Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned NumPy for independent binary readback only
        run: python -m pip install --only-binary=:all: numpy==2.2.6
      - name: Verify isolated syntax
        run: python -m py_compile icarus_engine/external_hft_stage.py icarus_engine/external_hft_verify.py icarus_engine/external_hft_numpy.py tests_engine/test_external_hft_numpy.py
      - name: Verify independent producer-consumer-native binary parity and refusal
        run: python -m unittest discover -s tests_engine -p "test_external_hft_numpy.py" -v
