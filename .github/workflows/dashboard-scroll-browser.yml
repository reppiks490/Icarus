name: dashboard-scroll-browser

on:
  push:
    paths:
      - ".github/workflows/dashboard-scroll-browser.yml"
      - "icarus_engine/world-immersion.js"
      - "icarus_engine/experience-ui.css"
      - "tests_engine/test_world_immersion.py"
  pull_request:
    paths:
      - ".github/workflows/dashboard-scroll-browser.yml"
      - "icarus_engine/world-immersion.js"
      - "icarus_engine/experience-ui.css"
      - "tests_engine/test_world_immersion.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-scroll-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-scroll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install browser test dependencies
        run: python -m pip install --disable-pip-version-check pytest playwright
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run immersion browser regressions without optional skips
        run: python -m pytest tests_engine/test_world_immersion.py -q
        env:
          ICARUS_REQUIRE_WORKSPACE_BROWSER: "1"
          TZ: UTC
