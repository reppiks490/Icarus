name: ascendancy-genome-core-contract

on:
  push:
    branches: [feat/ascendancy-genome-core-current-main-v2]
    paths:
      - "icarus_engine/ascendancy/genome.py"
      - "icarus_engine/ascendancy/archive.py"
      - "icarus_engine/ascendancy/frontier.py"
      - "tests_engine/test_ascendancy_genome.py"
      - "tests_engine/test_ascendancy_archive.py"
      - "tests_engine/test_ascendancy_frontier.py"
      - ".github/workflows/ascendancy-genome-core-contract.yml"
  pull_request:
    paths:
      - "icarus_engine/ascendancy/genome.py"
      - "icarus_engine/ascendancy/archive.py"
      - "icarus_engine/ascendancy/frontier.py"
      - "tests_engine/test_ascendancy_genome.py"
      - "tests_engine/test_ascendancy_archive.py"
      - "tests_engine/test_ascendancy_frontier.py"
      - ".github/workflows/ascendancy-genome-core-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bridge,databento]"
      - run: |
          python -m pytest tests_engine/test_ascendancy_genome.py tests_engine/test_ascendancy_archive.py tests_engine/test_ascendancy_frontier.py -q
