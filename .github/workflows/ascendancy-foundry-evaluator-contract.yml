name: ascendancy-foundry-evaluator-contract

on:
  push:
    branches:
      - feat/ascendancy-foundry-evaluator-current-main
    paths:
      - "icarus_engine/ascendancy/foundry.py"
      - "icarus_engine/ascendancy/evaluator.py"
      - "tests_engine/test_ascendancy_foundry.py"
      - "tests_engine/test_ascendancy_evaluator.py"
      - ".github/workflows/ascendancy-foundry-evaluator-contract.yml"
  pull_request:
    paths:
      - "icarus_engine/ascendancy/foundry.py"
      - "icarus_engine/ascendancy/evaluator.py"
      - "tests_engine/test_ascendancy_foundry.py"
      - "tests_engine/test_ascendancy_evaluator.py"
      - ".github/workflows/ascendancy-foundry-evaluator-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ascendancy-foundry-evaluator-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,bridge,databento]"
      - run: |
          python -m pytest             tests_engine/test_ascendancy_foundry.py             tests_engine/test_ascendancy_evaluator.py -q
