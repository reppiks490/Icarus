name: External quant catalog quarantine contract

on:
  pull_request:
    paths:
      - "icarus_engine/external_quant_catalog.py"
      - "tests_engine/test_external_quant_catalog.py"
      - "docs/integrations/EXTERNAL_QUANT_CATALOG.md"
      - ".github/workflows/external-quant-catalog-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Syntax
        run: python -m py_compile icarus_engine/external_quant_catalog.py tests_engine/test_external_quant_catalog.py
      - name: Quarantine and provenance regression contract
        run: python -m unittest discover -s tests_engine -p "test_external_quant_catalog.py" -v
