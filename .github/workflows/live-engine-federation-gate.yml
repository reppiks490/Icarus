name: live-engine-federation-gate

on:
  push:
    branches:
      - main
      - feat/live-engine-federation-gate-20261002-v2
    paths:
      - "icarus_engine/brain_sync.py"
      - "icarus_engine/federation_acceptance.py"
      - "tests_engine/test_brain_sync.py"
      - "tests_engine/test_federation_acceptance.py"
      - ".github/workflows/live-engine-federation-gate.yml"
  pull_request:
    paths:
      - "icarus_engine/brain_sync.py"
      - "icarus_engine/federation_acceptance.py"
      - "tests_engine/test_brain_sync.py"
      - "tests_engine/test_federation_acceptance.py"
      - ".github/workflows/live-engine-federation-gate.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: live-engine-federation-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bilateral-federation:
    name: Validate live bilateral Adaptive Brain federation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical Icarus
        uses: actions/checkout@v4
        with:
          path: icarus

      - name: Checkout live Icarus-engine main
        uses: actions/checkout@v4
        with:
          repository: reppiks490/Icarus-engine
          ref: main
          path: peer-engine
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run canonical BrainRemoteSync against live peer corpus
        working-directory: icarus
        shell: bash
        run: |
          export ICARUS_SHA="$(git rev-parse HEAD)"
          export ENGINE_SHA="$(git -C ../peer-engine rev-parse HEAD)"
          python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from pathlib import Path

          from icarus_engine.brain_sync import (
              BrainRemoteSync,
              _REMOTE_API,
              _REMOTE_CONSUMER_CONTRACT_API,
              _REMOTE_PRODUCER_CONTRACT_API,
              _REMOTE_PEER_PACKET_API,
              _git_blob_sha,
              _remote_compare_api,
              _remote_contents_api,
          )

          peer = Path("../peer-engine")
          mcp = peer / "automation_intelligence" / "mcp_interface"
          event_dir = mcp / "events"
          virtual = {}

          def meta_for(path, label):
              raw = path.read_bytes()
              url = "memory://" + label
              virtual[url] = raw
              return {"type": "file", "sha": _git_blob_sha(raw), "url": url}

          consumer_meta = meta_for(mcp / "icarus_consumer_contract.json", "consumer")
          producer_meta = meta_for(mcp / "contract.json", "producer")
          peer_packet_path = peer / "automation_intelligence" / "interrepo" / "latest.json"
          peer_packet_meta = meta_for(peer_packet_path, "peer-packet")
          peer_packet_doc = json.loads(peer_packet_path.read_text(encoding="utf-8"))
          peer_source_compare_url = _remote_compare_api(peer_packet_doc["source_commit"])
          consumer_doc = json.loads((mcp / "icarus_consumer_contract.json").read_text(encoding="utf-8"))

          historical_meta = {}
          for source in consumer_doc.get("historical_context", {}).get("sources", []):
              path = peer / source["path"]
              if not path.is_file():
                  raise AssertionError("declared historical source missing: " + source["path"])
              historical_meta[_remote_contents_api(source["path"])] = meta_for(
                  path,
                  "historical/" + source["id"],
              )

          packet_historical_meta = {}
          for artifact in peer_packet_doc.get("historical_artifacts", []):
              artifact_path = artifact["path"]
              raw = subprocess.check_output(
                  [
                      "git",
                      "-C",
                      "../peer-engine",
                      "show",
                      f"{peer_packet_doc['source_commit']}:{artifact_path}",
                  ]
              )
              url = "memory://packet-historical/" + artifact["lane"]
              virtual[url] = raw
              packet_historical_meta[
                  _remote_contents_api(
                      artifact_path,
                      ref=peer_packet_doc["source_commit"],
                  )
              ] = {
                  "type": "file",
                  "name": Path(artifact_path).name,
                  "path": artifact_path,
                  "sha": _git_blob_sha(raw),
                  "url": url,
              }

          source_contract_meta = {}
          for contract_id, contract_path in peer_packet_doc.get("source_contracts", {}).items():
              claimed_blob = peer_packet_doc.get("source_contract_blobs", {}).get(contract_id)
              raw = subprocess.check_output(
                  [
                      "git",
                      "-C",
                      str(peer),
                      "show",
                      f"{peer_packet_doc['source_commit']}:{contract_path}",
                  ]
              )
              assert _git_blob_sha(raw) == claimed_blob, (
                  "source contract witness mismatch: " + str(contract_id)
              )
              url = "memory://source-contract/" + str(contract_id)
              virtual[url] = raw
              source_contract_meta[
                  _remote_contents_api(
                      contract_path,
                      ref=peer_packet_doc["source_commit"],
                  )
              ] = {
                  "type": "file",
                  "name": Path(contract_path).name,
                  "path": contract_path,
                  "sha": claimed_blob,
                  "url": url,
              }

          lane_source_meta = {}
          for lane in peer_packet_doc.get("lanes", []):
              if lane.get("worker_repository") != "reppiks490/Icarus-engine":
                  continue
              for kind in ("heartbeat", "finalization"):
                  source_path = lane.get(kind + "_path")
                  source_blob = lane.get(kind + "_blob_sha")
                  if source_blob is None:
                      continue
                  raw = subprocess.check_output(
                      [
                          "git",
                          "-C",
                          str(peer),
                          "show",
                          f"{peer_packet_doc['source_commit']}:{source_path}",
                      ]
                  )
                  assert _git_blob_sha(raw) == source_blob, (
                      "lane source witness mismatch: "
                      + str(lane.get("name"))
                      + ":"
                      + kind
                  )
                  url = (
                      "memory://lane-source/"
                      + str(lane.get("name"))
                      + "/"
                      + kind
                  )
                  virtual[url] = raw
                  lane_source_meta[
                      _remote_contents_api(
                          source_path,
                          ref=peer_packet_doc["source_commit"],
                      )
                  ] = {
                      "type": "file",
                      "name": Path(source_path).name,
                      "path": source_path,
                      "sha": source_blob,
                      "url": url,
                  }

          listing = []
          for path in sorted(event_dir.glob("*.json")):
              item = meta_for(path, "event/" + path.name)
              item.update({
                  "name": path.name,
                  "path": "automation_intelligence/mcp_interface/events/" + path.name,
              })
              listing.append(item)

          def fetch_json(url):
              if url == _REMOTE_CONSUMER_CONTRACT_API:
                  return consumer_meta
              if url == _REMOTE_PRODUCER_CONTRACT_API:
                  return producer_meta
              if url == _REMOTE_PEER_PACKET_API:
                  return peer_packet_meta
              if url == peer_source_compare_url:
                  source = peer_packet_doc["source_commit"]
                  subprocess.run(
                      [
                          "git",
                          "-C",
                          "../peer-engine",
                          "merge-base",
                          "--is-ancestor",
                          source,
                          os.environ["ENGINE_SHA"],
                      ],
                      check=True,
                  )
                  relation = "identical" if source == os.environ["ENGINE_SHA"] else "ahead"
                  return {
                      "status": relation,
                      "base_commit": {"sha": source},
                      "merge_base_commit": {"sha": source},
                  }
              if url == _REMOTE_API:
                  return listing
              if url in historical_meta:
                  return historical_meta[url]
              if url in packet_historical_meta:
                  return packet_historical_meta[url]
              if url in lane_source_meta:
                  return lane_source_meta[url]
              if url in source_contract_meta:
                  return source_contract_meta[url]
              raise AssertionError("unexpected federation URL: " + url)

          def fetch_bytes(url):
              return virtual[url]

          with tempfile.TemporaryDirectory() as tmp:
              sync = BrainRemoteSync(
                  tmp,
                  interval_seconds=30,
                  fetch_json=fetch_json,
                  fetch_bytes=fetch_bytes,
              )
              state = sync.sync_once()

          assert state["status"] == "green", state
          truth = state["truth_contract"]
          assert truth["federation_schema"] == "icarus-engine-brain-federation-v1"
          assert truth["strict_event_contract"] is True
          assert truth["event_records"] == "RESEARCH_OBSERVABILITY_ONLY"
          assert truth["durability_receipts_are_substantive_evidence"] is False
          assert truth["raw_owner_data_transfer"] is False
          assert truth["automatic_model_promotion"] is False
          assert truth["production_decision_authorized"] is False
          assert truth["automatic_execution_authority"] is False
          assert state["execution_authorized"] is False
          assert state["production_decision_authorized"] is False
          assert state["consumer_contract_blob_sha"] == consumer_meta["sha"]
          assert state["producer_contract_blob_sha"] == producer_meta["sha"]
          assert state["peer_packet_status"] == "green", state
          assert state["peer_packet_blob_sha"] == peer_packet_meta["sha"]
          assert state["peer_source_commit"]
          assert state["peer_source_commit_verified"] is True
          assert state["peer_source_commit_relation"] in {"AHEAD", "IDENTICAL"}
          assert state["peer_packet_fresh"] is True, state
          assert state["peer_packet_age_seconds"] <= truth["peer_packet_max_age_seconds"]
          assert truth["peer_packet_freshness_required"] is True
          assert truth["peer_packet_max_age_seconds"] == 1800
          assert truth["peer_packet_max_future_skew_seconds"] == 300
          assert state["peer_packet_id"]
          subprocess.run(
              [
                  "git",
                  "-C",
                  "../peer-engine",
                  "merge-base",
                  "--is-ancestor",
                  state["peer_source_commit"],
                  os.environ["ENGINE_SHA"],
              ],
              check=True,
          )
          assert truth["peer_packet_schema"] == "icarus-peer-intelligence-packet-v1"
          assert truth["peer_packet_authority"] == "OBSERVE"
          assert all(lane["execution_authorized"] is False for lane in state["peer_lanes"])
          local_lanes = [
              lane for lane in state["peer_lanes"]
              if lane["worker_repository"] == "reppiks490/Icarus-engine"
          ]
          assert state["peer_source_contract_witness_status"] == "green"
          assert state["peer_source_contract_witness_count"] == 3
          assert all(
              row["verified"] is True
              for row in state["peer_source_contract_witnesses"]
          )
          assert state["peer_lane_witness_verified_count"] == len(local_lanes)
          assert state["peer_lane_contract_binding_verified_count"] == len(state["peer_lanes"])
          assert all(lane["contract_binding_verified"] is True for lane in state["peer_lanes"])
          assert all(lane["source_witness_verified"] is True for lane in local_lanes)
          assert all(
              lane["source_witness_status"] == "VERIFIED_AT_PACKET_SOURCE"
              for lane in local_lanes
          )
          assert all(
              lane["evidence_status"] != "DURABILITY_ONLY"
              or lane["substantive_research_evidence"] is False
              for lane in state["peer_lanes"]
          )

          report = {
              "schema_version": "icarus-live-bilateral-federation-receipt-v1",
              "icarus_commit": os.environ["ICARUS_SHA"],
              "icarus_engine_commit": os.environ["ENGINE_SHA"],
              "peer_event_file_count": len(listing),
              "ingested_total": state["ingested_total"],
              "rejected_total": state["rejected_total"],
              "legacy_exception_count": truth["legacy_exception_count"],
              "federation_schema": truth["federation_schema"],
              "peer_packet_status": state["peer_packet_status"],
              "peer_packet_id": state["peer_packet_id"],
              "peer_packet_blob_sha": state["peer_packet_blob_sha"],
              "peer_source_commit": state["peer_source_commit"],
              "peer_source_commit_verified": state["peer_source_commit_verified"],
              "peer_source_commit_relation": state["peer_source_commit_relation"],
              "peer_source_commit_ancestor_of_engine_head": True,
              "peer_packet_fresh": state["peer_packet_fresh"],
              "peer_packet_age_seconds": state["peer_packet_age_seconds"],
              "peer_packet_max_age_seconds": truth["peer_packet_max_age_seconds"],
              "peer_packet_max_future_skew_seconds": truth["peer_packet_max_future_skew_seconds"],
              "peer_lane_count": len(state["peer_lanes"]),
              "peer_substantive_lane_count": state["peer_substantive_lane_count"],
              "peer_durability_only_lane_count": state["peer_durability_only_lane_count"],
              "peer_lane_witness_verified_count": state["peer_lane_witness_verified_count"],
              "peer_lane_witness_unavailable_count": state["peer_lane_witness_unavailable_count"],
              "peer_lane_contract_binding_verified_count": state["peer_lane_contract_binding_verified_count"],
              "peer_lane_source_witnesses_required": truth["peer_lane_source_witnesses_required"],
              "peer_source_contract_witness_status": state["peer_source_contract_witness_status"],
              "peer_source_contract_witness_count": state["peer_source_contract_witness_count"],
              "peer_source_contract_blob_witnesses_required": truth["peer_source_contract_blob_witnesses_required"],
              "strict_event_contract": truth["strict_event_contract"],
              "event_records": truth["event_records"],
              "execution_authorized": False,
              "production_decision_authorized": False,
          }
          Path("../live-engine-federation-receipt.json").write_text(
              json.dumps(report, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, sort_keys=True))
          PY

      - name: Preserve bilateral federation receipt
        uses: actions/upload-artifact@v4
        with:
          name: live-engine-federation-receipt
          path: live-engine-federation-receipt.json
          if-no-files-found: error
          retention-days: 14


  persist-acceptance:
    name: Persist canonical Icarus-engine acceptance
    needs: bilateral-federation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout canonical Icarus main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download verified federation receipt
        uses: actions/download-artifact@v4
        with:
          name: live-engine-federation-receipt
          path: .federation-receipt

      - name: Build idempotent canonical acceptance
        run: |
          python -m icarus_engine.federation_acceptance \
            --input .federation-receipt/live-engine-federation-receipt.json \
            --output automation_intelligence/federation/icarus_engine_acceptance.json

      - name: Stage only canonical acceptance
        shell: bash
        run: |
          set -euo pipefail
          git add automation_intelligence/federation/icarus_engine_acceptance.json
          if git diff --cached --quiet; then
            echo "ACCEPTANCE_NO_CHANGE=1" >> "$GITHUB_ENV"
            exit 0
          fi
          staged="$(git diff --cached --name-only)"
          if [ "$staged" != "automation_intelligence/federation/icarus_engine_acceptance.json" ]; then
            echo "Refusing out-of-scope federation acceptance mutation:" >&2
            printf '%s\n' "$staged" >&2
            exit 1
          fi
          echo "ACCEPTANCE_NO_CHANGE=0" >> "$GITHUB_ENV"

      - name: Commit canonical acceptance
        if: env.ACCEPTANCE_NO_CHANGE != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "federation: accept verified Icarus-engine peer packet [skip ci]"

          pushed=0
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "Acceptance rebase conflict; refusing unsafe automatic resolution." >&2
              exit 1
            fi
            if git push origin HEAD:main; then
              pushed=1
              break
            fi
            if [ "$attempt" -lt 5 ]; then
              sleep $((attempt * 2))
            fi
          done

          if [ "$pushed" -ne 1 ]; then
            echo "Failed to persist federation acceptance after 5 optimistic push attempts." >&2
            exit 1
          fi
