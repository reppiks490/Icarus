name: Runtime expiry boundary repair
on:
  push:
    branches:
      - icarus1/restart-readiness-20261020
    paths:
      - .github/workflows/runtime-expiry-boundary-fix.yml
permissions:
  contents: write
jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply narrow runtime-expiry correction
        shell: bash
        run: |
          set -euo pipefail
          git checkout b11aa487875f44499a379a73aa9f099a7e2e7262 -- icarus_engine/workspace-client.js
          python - <<'PY'
          from pathlib import Path

          dashboard = Path('icarus_engine/dashboard.html')
          text = dashboard.read_text(encoding='utf-8')
          marker = "let statusLoadSeq = 0, lastStatusAt = 0;"
          assert text.count(marker) == 1
          text = text.replace(marker, marker + "\nlet statusPollBusy = false;", 1)
          needle = """async function refresh() {
            const sequence=++statusLoadSeq;
            try {
              const d=await IcarusClient.read('status',{channel:'core-status'});
              if(sequence!==statusLoadSeq)return;
              if (!d || !Array.isArray(d.assets)) throw new Error(d?.detail||'Invalid selected runtime status');
              lastStatusAt=Date.now();
              render(d);
            } catch (e) {
              if(sequence===statusLoadSeq)expireCoreObservations('Selected runtime unavailable: '+(e.message||String(e)));
            }
          }
          async function refreshCombinedPaperPnl() {
          """
          replacement = """async function refresh() {
            const sequence=++statusLoadSeq;
            try {
              const d=await IcarusClient.read('status',{channel:'core-status'});
              if(sequence!==statusLoadSeq)return;
              if (!d || !Array.isArray(d.assets)) throw new Error(d?.detail||'Invalid selected runtime status');
              lastStatusAt=Date.now();
              render(d);
            } catch (e) {
              if(sequence===statusLoadSeq)expireCoreObservations('Selected runtime unavailable: '+(e.message||String(e)));
            }
          }
          async function pollStatus() {
            if(statusPollBusy)return;
            statusPollBusy=true;
            try { await refresh(); }
            finally { statusPollBusy=false; }
          }
          async function refreshCombinedPaperPnl() {
          """
          assert text.count(needle) == 1
          text = text.replace(needle, replacement, 1)
          timer = "setInterval(refresh, 3000);"
          assert text.count(timer) == 1
          text = text.replace(timer, "setInterval(()=>void pollStatus(), 3000);", 1)
          dashboard.write_text(text, encoding='utf-8')

          regression = Path('tests_engine/test_runtime_expiry_regression.py')
          regression.write_text('''"""Regression coverage for selected-workspace status expiry."""\n\nfrom tests_engine.test_workspace_api import workspace_http  # noqa: F401\n\n\ndef test_selected_status_snapshots_only_selected_workspace(workspace_http, monkeypatch):\n    """A cc1 status read must not pay for cc2-cc4 snapshot work."""\n    server, _, request = workspace_http\n    manager = server.command_centers\n    original = manager._profile_snapshot\n    touched = []\n\n    def observed(profile_id, now):\n        touched.append(profile_id)\n        return original(profile_id, now)\n\n    monkeypatch.setattr(manager, "_profile_snapshot", observed)\n    code, payload, _ = request("/api/command-centers/cc1/status")\n\n    assert code == 200\n    assert payload["workspace_id"] == "cc1"\n    assert payload["paper_only"] is True\n    assert payload["execution_authorized"] is False\n    assert touched == ["cc1"]\n''', encoding='utf-8')

          browser = Path('tests_engine/test_workspace_dashboard_browser.py')
          source = browser.read_text(encoding='utf-8')
          anchor = '''        assert page.evaluate("last?.assets[0]?.price")==100\n\n\ndef test_common_backtest_job_and_csv_retain_accepted_source_revision(workspace_http):\n'''
          insert = '''        assert page.evaluate("last?.assets[0]?.price")==100\n\n\ndef test_periodic_status_poll_is_single_flight(workspace_http):\n    _, _, request = workspace_http\n    code, status, _ = request("/api/command-centers/cc1/status")\n    assert code == 200\n    with common_page(workspace_http) as (page, base):\n        held = []\n        page.route(base + "/api/command-centers/cc1/status", lambda route: held.append(route))\n        page.evaluate("()=>{window.periodicOne=pollStatus();window.periodicTwo=pollStatus();return null}")\n        for _ in range(20):\n            if held:\n                break\n            page.wait_for_timeout(20)\n        assert len(held) == 1\n        held[0].fulfill(status=200, content_type="application/json", body=json.dumps(status))\n        page.evaluate("async()=>{await window.periodicOne;await window.periodicTwo}")\n        assert page.evaluate("last?.assets[0]?.price") == 100\n\n\ndef test_common_backtest_job_and_csv_retain_accepted_source_revision(workspace_http):\n'''
          assert source.count(anchor) == 1
          browser.write_text(source.replace(anchor, insert, 1), encoding='utf-8')
          PY
          git diff --check
      - name: Install test dependencies
        run: pip install -e ".[dev,ml,bridge,databento]" playwright
      - name: Verify transport and selected-status regressions
        env:
          TZ: UTC
        run: python -m pytest tests_engine/test_runtime_expiry_regression.py tests_engine/test_workspace_client.py tests_engine/test_workspace_api.py -q
      - name: Install Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          node -e "require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'ICARUS_BROWSER_BINARY=' + require('playwright').chromium.executablePath() + '\n')"
      - name: Verify refresh ordering and single-flight polling in Chromium
        env:
          TZ: UTC
          ICARUS_REQUIRE_WORKSPACE_BROWSER: '1'
        run: python -m pytest tests_engine/test_workspace_dashboard_browser.py -k 'late_failed_refresh or periodic_status_poll' -q
      - name: Verify full Linux engine suite
        env:
          TZ: UTC
        run: python -m pytest tests_engine tests/test_provider_corpus_intake.py -q
      - name: Commit verified correction and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/runtime-expiry-boundary-fix.yml
          git add icarus_engine/workspace-client.js icarus_engine/dashboard.html tests_engine/test_runtime_expiry_regression.py tests_engine/test_workspace_dashboard_browser.py
          git diff --cached --check
          git config user.name "Icarus Runtime Recovery"
          git config user.email "icarus-runtime-recovery@users.noreply.github.com"
          git commit -m "fix: guard periodic status polling without coalescing manual refresh"
          git push origin HEAD:icarus1/restart-readiness-20261020
