name: OMNIGENESIS Expo lockfile regeneration evidence
on:
  pull_request:
    paths:
      - '.github/workflows/omnigenesis-expo-lock-evidence.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lock-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
      - name: Regenerate lockfile using actual npm resolver without scripts
        working-directory: mobile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund 'expo@~57.0.33' 'expo-constants@~57.0.24' 'expo-notifications@~57.0.25'
      - name: Emit compressed, reproducible lockfile delta to repair original branch
        run: |
          node <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const crypto = require('crypto');
          const zlib = require('zlib');
          const oldLockText = cp.execFileSync('git', ['show', 'HEAD:mobile/package-lock.json'], {encoding: 'utf8'});
          const oldPkgText = cp.execFileSync('git', ['show', 'HEAD:mobile/package.json'], {encoding: 'utf8'});
          const newLockText = fs.readFileSync('mobile/package-lock.json', 'utf8');
          const newPkgText = fs.readFileSync('mobile/package.json', 'utf8');
          const oldLock = JSON.parse(oldLockText), newLock = JSON.parse(newLockText);
          const changed = {}, removed = [];
          for (const key of new Set([...Object.keys(oldLock.packages), ...Object.keys(newLock.packages)])) {
            const before = oldLock.packages[key], after = newLock.packages[key];
            if (JSON.stringify(before) !== JSON.stringify(after)) {
              if (after === undefined) removed.push(key);
              else changed[key] = after;
            }
          }
          const delta = {
            fromLockSha256: crypto.createHash('sha256').update(oldLockText).digest('hex'),
            newLockSha256: crypto.createHash('sha256').update(newLockText).digest('hex'),
            newPackageSha256: crypto.createHash('sha256').update(newPkgText).digest('hex'),
            packageJSON: JSON.parse(newPkgText),
            topLevel: Object.fromEntries(Object.entries(newLock).filter(([k]) => k !== 'packages')),
            changed, removed
          };
          console.log('LOCK_DELTA_COUNT', Object.keys(changed).length, removed.length);
          console.log('LOCK_DELTA_BEGIN');
          console.log(zlib.gzipSync(Buffer.from(JSON.stringify(delta))).toString('base64'));
          console.log('LOCK_DELTA_END');
          NODE
