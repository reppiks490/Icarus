name: Independent HFT native NPY consumer contract

on:
  pull_request:
    paths:
      - "icarus_engine/external_hft_native_verify.py"
      - "tests_engine/test_external_hft_native_verify.py"
      - ".github/workflows/external-hft-native-verify.yml"
      - "docs/integrations/HFT_NATIVE_INDEPENDENT_VERIFICATION.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-consumer:
    name: Independent native consumer Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check offline research source syntax
        run: python -m py_compile icarus_engine/external_hft_stage.py icarus_engine/external_hft_verify.py icarus_engine/external_hft_numpy.py icarus_engine/external_hft_native_verify.py tests_engine/test_external_hft_native_verify.py
      - name: Verify independent full source-to-native byte parity and refusal paths
        run: python -m unittest discover -s tests_engine -p "test_external_hft_native_verify.py" -v
