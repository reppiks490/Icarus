# Grok (xAI) — 2026-09-20. Whole file. pytest on tests_engine. No paid-feed secrets.
name: tests
on:
  push:
  pull_request:

concurrency:
  group: icarus-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev,ml,bridge,databento]" "cryptography>=44,<47"
      - run: python -m pytest tests_engine tests/test_provider_corpus_intake.py -q
        env:
          TZ: UTC
      - run: python -m icarus_plant --root /tmp/icarus-plant-ci setup
      - run: icarus-control --help
      - run: python -m icarus_engine.cli doctor --json
        env:
          TZ: UTC
  engine-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev,bridge,databento]" "cryptography>=44,<47"
      - name: Verify Windows restart persistence and private-intake boundary
        run: python -m pytest tests_engine/test_restart_persistence.py tests/test_provider_corpus_intake.py -q
        env:
          TZ: UTC
      # Keep the new dashboard, private connection, corpus receipt and P&L contracts
      # covered on Windows. POSIX-only intake and optional browser cases self-skip.
      - run: >-
          python -m pytest
          tests_engine/test_plant.py
          tests_engine/test_bars.py
          tests_engine/test_doctor.py
          tests_engine/test_futures.py
          tests_engine/test_execution_controls.py
          tests_engine/test_engine_control.py
          tests_engine/test_backtest_validation.py
          tests_engine/test_mcp_server.py
          tests_engine/test_dashboard_js.py
          tests_engine/test_pantheon_aether.py
          tests_engine/test_apex_kernel.py
          tests_engine/test_apex_server.py
          tests_engine/test_apex_store.py
          tests_engine/test_apex_ancestry.py
          tests_engine/test_sibyl.py
