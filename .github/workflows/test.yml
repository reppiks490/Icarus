# Grok (xAI) — 2026-09-20. Whole file. pytest on tests_engine. No paid-feed secrets.
name: tests
on:
  push:
  pull_request:
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest tests_engine -q
        env:
          TZ: UTC
