name: NautilusTrader native quote structural parity (research only)

on:
  pull_request:
    paths:
      - "icarus_engine/external_nautilus_quote_bridge.py"
      - "tests_engine/test_external_nautilus_quote_bridge.py"
      - ".github/workflows/external-nautilus-quote-parity.yml"
      - "docs/integrations/NAUTILUS_QUOTE_PARITY.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-quote-parity:
    name: Native NautilusTrader 1.231.0 Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned public NautilusTrader wheel only
        run: |
          python -m pip install --only-binary=:all: "nautilus_trader==1.231.0"
      - name: Verify installed package version and compile
        run: |
          python -c "import importlib.metadata; assert importlib.metadata.version('nautilus_trader') == '1.231.0'"
          python -m py_compile icarus_engine/external_nautilus_quote_bridge.py tests_engine/test_external_nautilus_quote_bridge.py
      - name: Run all offline synthetic quote and native parity regressions
        run: python -m unittest discover -s tests_engine -p "test_external_nautilus_quote_bridge.py" -v
      - name: CLI help (no provider, broker or execution access)
        run: python -m icarus_engine.external_nautilus_quote_bridge --help
