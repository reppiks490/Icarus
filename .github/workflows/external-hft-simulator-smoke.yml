name: HFTBacktest pinned synthetic-only native simulator smoke

on:
  pull_request:
    paths:
      - "icarus_engine/external_hft_simulator_smoke.py"
      - "tests_engine/test_external_hft_simulator_smoke.py"
      - ".github/workflows/external-hft-simulator-smoke.yml"
      - "docs/integrations/HFT_NATIVE_SIMULATOR_SMOKE.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-no-orders:
    name: HFTBacktest 2.4.4 synthetic-only Python 3.11
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned open-source simulator on isolated CI runner only
        run: |
          python -m pip install --disable-pip-version-check "hftbacktest==2.4.4" "numpy==2.2.6" "numba==0.61.2"
      - name: Assert native package and source syntax
        run: |
          python -c "import hftbacktest; assert hftbacktest.__version__ == '2.4.4'"
          python -m py_compile icarus_engine/external_hft_simulator_smoke.py tests_engine/test_external_hft_simulator_smoke.py
      - name: Run isolated synthetic-only unit tests and native simulator
        run: |
          python -m unittest tests_engine.test_external_hft_simulator_smoke -v
          python -m icarus_engine.external_hft_simulator_smoke
