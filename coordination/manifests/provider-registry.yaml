schema_version: icarus-provider-registry-v2
pipeline_policy_version: icarus-control-v1

authority_rule: >
  Provider availability does not grant strategy or execution authority.
  Provider outputs terminate at evidence, research, diagnostics, or presentation
  boundaries unless separately qualified and promoted through the pipeline.

health_model:
  semantics: Dynamic provider health is runtime evidence and is not stored in static provider declarations.
  states:
    - OK
    - DEGRADED
    - STALE
    - UNCONFIGURED
    - DISABLED
    - PLAN_LIMITED
    - ENTITLEMENT_REQUIRED
    - CONFIGURATION_BLOCKED
    - ERROR

